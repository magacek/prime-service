services:
  primes-service:
    image: primes-service
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: primes-service
    ports:
      - "4001:8080"
    environment:
      - server.port=8080
      - spring.datasource.url=jdbc:postgresql://primes-database:5432/primes
      - spring.datasource.username=postgres
      - spring.datasource.password=password
      - spring.jpa.hibernate.ddl-auto=update
      - spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
      - spring.sql.init.mode=always
      - logging.level.root=INFO
      - logging.level.org.springframework.security=DEBUG
      - logging.level.edu.iu.p466.prime_service=DEBUG
      - logging.level.org.springframework.web.cors=TRACE
      - spring.web.cors.allowed-origins=*
      - spring.web.cors.allowed-methods=*
      - spring.web.cors.allowed-headers=*
    restart: "no"
    depends_on:
      - primes-service-database-postgres

  primes-service-database-postgres:
    image: postgres:alpine
    container_name: primes-database
    ports:
      - "5001:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: primes
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
