spring:
  application:
    name: prime-service
  datasource:
    url: jdbc:postgresql://localhost:5001/primes
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: always
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: false

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    edu.iu.p466.prime_service: DEBUG
    org.springframework.web.cors: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
